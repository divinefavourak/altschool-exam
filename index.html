<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
    <!-- Top bar saying weather app -->
    <div id="topbar" class="topbar">
     <h1>Weather App</h1>
    </div>
    <!--Search box-->
    <div class="search-box">
        <textarea name="search" id="search-box" placeholder="Search city"></textarea>
        <button id="search-btn">Search</button>
    </div>

    <!--Hero section-->
    <hero>
        <div id="city-card" class="city-card">
        <!-- weather Icon -->
        
        <h1 id="city-name">Lagos, Nigeria</h1>
        <h3 id="temperature"> 28°C</h3>
        <h4 id="description">Sunny</h4>
    </div>
    </hero>
 <!--Weather detail section-->
 <div class="weather-detail" id="weather-detail">
  <table id="weather-detail-table">
    <tr>
      <th id="humidity">Humidity</th>
      <th id="feels-like">Feels Like</th>
      <th id="wind-speed">Wind Speed</th>
    </tr>
    <tr>
      <td id="humidity-value">60%</td>
      <td id="feels-like-value">28°C</td>
      <td id="wind-speed-value">5km/h</td>
    </tr>
  </table>
 </div>
<!-- Five day forecast section -->
 <section class="five-day-forecast">
    <h2>5-day forecast</h2>
    <div class="forecast">
        <div class="forecast-day">
            <h3 class="forecast-day-name">Monday</h3>
            <h3 class="forecast-day-temperature">28°C</h3>
            <h3 class="forecast-day-description">Sunny</h3>
        </div>
    </div>
 </section>
</main>
<button onclick="testWeatherData()">Test Weather Data</button>
    <script src="script.js"></script>
</body>
</html>
