<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <!-- 1. Header Navigation Bar -->
        <header>
            <div id="topbar" class="topbar">
                <h1>Weather App</h1>
            </div>
        </header>

        <!-- 2. Search Box Section -->
        <div class="search-container">
            <input type="text" name="search-box" id="search-box" list="search-history-list" placeholder="Search city...">
            <datalist id="search-history-list"></datalist>
            <button id="search-btn">Search</button>
        </div>

        <div class="error-message" id="error-message">Unable to get weather</div>

        <!-- 3. Current Weather Hero Card -->
        <section class="hero-section">
            <div id="city-card" class="city-card">
                <div class="spinner"></div>
                <p id="loading-text">Loading weather data......</p>
                <h1 id="weather-icon"></h1>
                <h1 id="city-name"></h1>
                <div class="weather-info-row">
                    <h4 id="description"></h4>
                    <h4 id="temperature"></h4>
                </div>
            </div>
        </section>

        <!-- 4. Stats Row (Humidity, Wind Speed, UV Index) -->
        <section class="weather-detail-section">
            <div class="stats-card">
                <div class="stat-box">
                    <span class="stat-label">Humidity</span>
                    <span class="stat-value" id="humidity-value">--</span>
                </div>
                <div class="stat-box divider">
                    <span class="stat-label">Wind</span>
                    <span class="stat-value" id="wind-speed-value">--</span>
                </div>
                <div class="stat-box divider">
                    <span class="stat-label">UV Index</span>
                    <span class="stat-value" id="uv-index-value">--</span>
                </div>
            </div>
        </section>

        <!-- 5. Five-Day Forecast Section -->
        <section class="five-day-forecast-section">
            <h2 class="forecast-title">5-day forecast</h2>
            <div class="forecast" id="forecast">
                <div id="forecast-day" class="forecast-list"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
